<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Test API Sécurité</title>
    <style>
        body { font-family: Arial; max-width: 700px; margin: 50px auto; padding: 20px; }
        button { background: #2ec4b6; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; margin: 5px; }
        .btn-danger { background: #dc3545; }
        .btn-success { background: #28a745; }
        .btn-info { background: #17a2b8; }
        button:hover { opacity: 0.85; }
        #result { margin-top: 20px; padding: 15px; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; }
        input { padding: 8px; margin: 5px; border: 1px solid #ddd; border-radius: 8px; width: 80px; }
        .section { background: white; border: 1px solid #ddd; border-radius: 12px; padding: 15px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <h2>🔒 Test API Sécurité Utilisateurs</h2>

    <div class="section">
        <h3>1. Bloquer un utilisateur</h3>
        <input type="number" id="blockId" value="1" placeholder="ID">
        <button class="btn-danger" onclick="blockUser()">🚫 Bloquer</button>
    </div>

    <div class="section">
        <h3>2. Débloquer un utilisateur</h3>
        <input type="number" id="unblockId" value="1" placeholder="ID">
        <button class="btn-success" onclick="unblockUser()">✅ Débloquer</button>
    </div>

    <div class="section">
        <h3>3. Statut d'un utilisateur</h3>
        <input type="number" id="statusId" value="1" placeholder="ID">
        <button class="btn-info" onclick="getUserStatus()">🔍 Voir statut</button>
    </div>

    <div class="section">
        <h3>4. Liste des utilisateurs bloqués</h3>
        <button onclick="getBlockedUsers()">📋 Voir liste</button>
    </div>

    <div id="result">Les résultats s'affichent ici...</div>

    <script>
        const BASE_URL = 'http://127.0.0.1:8000/api/users';

        async function blockUser() {
            const id = document.getElementById('blockId').value;
            try {
                const response = await fetch(`${BASE_URL}/${id}/block`, { method: 'PUT' });
                const data = await response.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        async function unblockUser() {
            const id = document.getElementById('unblockId').value;
            try {
                const response = await fetch(`${BASE_URL}/${id}/unblock`, { method: 'PUT' });
                const data = await response.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        async function getUserStatus() {
            const id = document.getElementById('statusId').value;
            try {
                const response = await fetch(`${BASE_URL}/${id}/status`);
                const data = await response.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        async function getBlockedUsers() {
            try {
                const response = await fetch(`${BASE_URL}/blocked`);
                const data = await response.json();
                showResult(data);
            } catch (error) {
                showResult({ error: error.message });
            }
        }

        function showResult(data) {
            document.getElementById('result').textContent = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
